commands:
  - command: ". ./dynamodb-explorer.sh"
    description: "List the tables, pick one and browse its items (paged scan, filter), then view, create, edit, duplicate or delete items. Uses the aws CLI (or awslocal) and jq; the profile, region, expected account, endpoint, page size and read-only mode come from this project's variables."
    folder_id: "f_proj_aws_sf_0"
    icon: "table"
    id: "c_f_proj_aws_0"
    kip: true
    name: "Table explorer"
    type: "command"
  - command: "aws ecr get-login-password --region {{AWS_REGION}} --profile {{AWS_PROFILE}} | docker login --username AWS --password-stdin {{AWS_ACCOUNT_ID}}.dkr.ecr.{{AWS_REGION}}.amazonaws.com"
    folder_id: "f_proj_aws"
    icon: "key-square"
    id: "c_f_proj_aws_login"
    name: "Login"
    terminal_target: "@parent"
    type: "command"
env_vars:
  AWS_ACCOUNT_ID: "792740635854"
  AWS_CLI: "aws"
  AWS_PROFILE: "magazord-ps-marketplaces-maintain"
  AWS_REGION: "sa-east-1"
  DYNAMODB_ENDPOINT: ""
  DYNAMODB_PAGE_SIZE: "5"
  DYNAMODB_READ_ONLY: "false"
folders:
  - icon: "database"
    id: "f_proj_aws_sf_0"
    name: "DynamoDB"
    order: 0
    parent_id: "f_proj_aws"
kai_export:
  scope: "folder"
  version: 1
